[package]
name = "location-spoofer"
version = "0.1.0"
edition = "2021"
description = "Standalone desktop app that simulates an iPhone's GPS location over USB"
license = "MIT"
publish = false
default-run = "location-spoofer"

[features]
default = ["gui"]
# Native window (WebView2 on Windows, WKWebView on macOS, WebKitGTK on Linux).
# Without it the app serves the UI and opens the system browser instead.
gui = ["dep:tao", "dep:wry", "dep:png", "dep:webview2-com", "dep:windows-core"]
# Microsoft Store build: no self-updater (the Store delivers updates).
store = []

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "process", "signal"] }
axum = { version = "0.8", features = ["multipart", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
roxmltree = "0.20"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
url = "2"
percent-encoding = "2"
rand = "0.8"
regex = "1"
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
dirs = "6"
sha2 = "0.10"
hex = "0.4"
plist = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
open = "5"
semver = "1"
idevice = { version = "=0.1.68", default-features = false, features = [
    "ring",
    "usbmuxd",
    "core_device_proxy",
    "tunnel_tcp_stack",
    "rsd",
    "dvt",
    "location_simulation",
    "mobile_image_mounter",
    "tss",
    "amfi",
    "pair",
] }
tao = { version = "0.34", optional = true }
wry = { version = "0.53", optional = true }
png = { version = "0.17", optional = true }

# Windows: WebView2 permission handling for the window (the same versions wry uses).
[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.38", optional = true }
windows-core = { version = "0.61", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[package.metadata.winres]
ProductName = "Location Spoofer"
FileDescription = "Location Spoofer (standalone)"
