name: Build and release LocationSpoofer.exe

# Every push to main that changes code runs the tests, builds the Windows exe, self-tests it and
# publishes it as the latest GitHub Release. Installed copies of the exe pick it up automatically.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    env:
      VERSION: 1.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Build exe
        run: python packaging/build_exe.py --version $env:VERSION
      - name: Self-test the exe
        run: |
          dist\LocationSpoofer.exe --version
          dist\LocationSpoofer.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\LocationSpoofer.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist\LocationSpoofer.exe.sha256", "$h  LocationSpoofer.exe")
          Write-Host "SHA-256: $h"
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "Automatic build of ${GITHUB_SHA::7}."
            echo
            echo "${COMMIT_MSG:-Manual build}"
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 dist/LocationSpoofer.exe.sha256)\`"
          } > notes.md
          gh release create "v$VERSION" dist/LocationSpoofer.exe dist/LocationSpoofer.exe.sha256 \
            --title "LocationSpoofer $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
